<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت‌نام سانس فوتسال</title>

<style>
@font-face {
    font-family: 'Vazir';
    src: url('Vazir.woff2') format('woff2'),
         url('Vazir.woff') format('woff');
}

* { box-sizing: border-box; }

body {
    font-family: 'Vazir', sans-serif;
    direction: rtl;
    margin: 0;
    padding: 0;
    background: #f1f1f1;
    overflow-x: hidden;
}

/* ------------------------- لودینگ صفحه ------------------------- */
#loadingScreen {
    position: fixed;
    top: 0; right: 0;
    width: 100%; height: 100%;
    background: #f1f1f1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity .4s ease;
}

.ball-spinner {
    width: 55px;
    height: 55px;
    background-image: url('ball.svg');
    background-size: cover;
    animation: spinBall .9s linear infinite;
}

.mini-ball-spinner {
    width: 32px;
    height: 32px;
    background-image: url('ball.svg');
    background-size: cover;
    animation: spinBall .9s linear infinite;
}

@keyframes spinBall { 100% { transform: rotate(360deg); } }

.loading-text {
    margin-top: 15px;
    font-size: 15px;
    color: #444;
}

/* ------------------------- بدنه اصلی ------------------------- */
.wrapper {
    width: 100%;
    max-width: 430px;
    padding: 15px;
    margin: auto;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
    text-align: center;
}

.admin-btn {
    display: inline-block;
    padding: 10px 22px;
    background: #ff9800;
    color: white;
    font-size: 15px;
    border-radius: 10px;
    text-decoration: none;
    margin-bottom: 18px;
}

#sessionInfo {
    background: #fafafa;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #ddd;
    margin-bottom: 15px;
    font-size: 14px;
    line-height: 1.8;
}

#capacityBox {
    background: #28a745;
    padding: 12px;
    color: white;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* ------------------------- ورودی ------------------------- */
.input-row {
    display: flex;
    gap: 8px;
    width: 100%;
}
.input-row input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #bbb;
    font-size: 14px;
    min-width: 0;
}
.input-row button {
    width: 95px;
    padding: 12px;
    border-radius: 10px;
    background: #0b66d1;
    color: white;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
}
button:disabled { background: #888; }

/* ------------------------- لودینگ افزودن ------------------------- */
#addLoading {
    width: 100%;
    height: 120px;
    margin-top: 10px;

    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#addLoading.active { display: flex !important; }

/* ------------------------- لودینگ حذف ------------------------- */
#removeLoading {
    width: 100%;
    height: 120px;
    margin-top: 10px;

    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#removeLoading.active { display: flex !important; }

/* ------------------------- لیست بازیکنان ------------------------- */
ul {
    list-style: none;
    padding: 0;
    margin-top: 20px;
}
li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 14px;
}

.remove-btn {
    background: #d9534f;
    color: white;
    padding: 6px 9px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 12px;
}
</style>
</head>

<body>

<!-- ------------------------- لودینگ اولیه ------------------------- -->
<div id="loadingScreen">
    <div class="ball-spinner"></div>
    <div class="loading-text">در حال بارگذاری...</div>
</div>

<div class="wrapper" id="mainContent" style="opacity:0;">
    <div class="card">

        <a class="admin-btn" href="admin.html">ورود مدیر</a>

        <h2 style="margin:0 0 12px 0;">سانس فوتسال</h2>

        <div id="sessionInfo">در حال بارگذاری...</div>
        <div id="capacityBox"></div>

        <div class="input-row">
            <input id="playerName" placeholder="نام بازیکن">
            <button id="addBtn" onclick="addPlayer()">افزودن</button>
        </div>

        <!-- لودینگ افزودن -->
        <div id="addLoading">
            <div class="mini-ball-spinner"></div>
            <div style="font-size:13px; color:#444; margin-top:4px;">در حال افزودن...</div>
        </div>

        <!-- لودینگ حذف -->
        <div id="removeLoading">
            <div class="mini-ball-spinner"></div>
            <div style="font-size:13px; color:#444; margin-top:4px;">در حال حذف...</div>
        </div>

        <ul id="playersList"></ul>

    </div>
</div>

<script>
let SESSION_ID = null;
let CURRENT_PLAYER_COUNT = 0;

/* ------------------------- لودینگ صفحه ------------------------- */
function hideLoading() {
    let loader = document.getElementById("loadingScreen");
    loader.style.opacity = "0";
    setTimeout(() => {
        loader.style.display = "none";
        document.getElementById("mainContent").style.opacity = "1";
    }, 450);
}

/* ------------------------- لودینگ افزودن ------------------------- */
function showAddLoading() {
    document.getElementById("addLoading").classList.add("active");
}
function hideAddLoading() {
    document.getElementById("addLoading").classList.remove("active");
}

/* ------------------------- لودینگ حذف ------------------------- */
function showRemoveLoading() {
    document.getElementById("removeLoading").classList.add("active");
}
function hideRemoveLoading() {
    document.getElementById("removeLoading").classList.remove("active");
}

/* ------------------------- بارگذاری سانس ------------------------- */
async function loadSession() {
    let res = await fetch("/api/latest-session");
    let data = await res.json();

    if (!data || !data.id) {
        document.getElementById("sessionInfo").innerHTML = "<b>سانسی ثبت نشده</b>";
        hideLoading();
        return;
    }

    SESSION_ID = data.id;

    document.getElementById("sessionInfo").innerHTML =
        "<strong>روز:</strong> " + data.day + "<br>" +
        "<strong>ساعت:</strong> " + data.time + "<br>" +
        "<strong>سالن:</strong> " + data.place + "<br>" +
        "<strong>لوکیشن:</strong> <a href='" + data.location + "' target='_blank'>مشاهده</a>";

    await loadPlayers();
    hideLoading();
}

/* ------------------------- بارگذاری بازیکنان ------------------------- */
async function loadPlayers() {
    let res = await fetch("/api/players", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ session_id: SESSION_ID })
    });

    let players = await res.json();
    CURRENT_PLAYER_COUNT = players.length;

    let list = document.getElementById("playersList");
    list.innerHTML = "";

    players.forEach((p, i) => {
        let li = document.createElement("li");
        li.innerHTML =
            "<span>" + (i+1) + ". " + p.player_name + "</span>" +
            "<button class='remove-btn' onclick='removePlayer(" + p.id + ")'>حذف</button>";
        list.appendChild(li);
    });

    updateCapacity();
}

/* ------------------------- ظرفیت ------------------------- */
function updateCapacity() {
    const max = 12;
    let left = max - CURRENT_PLAYER_COUNT;
    let box = document.getElementById("capacityBox");

    if (left > 0) {
        box.style.background = "#28a745";
        box.innerHTML = "ظرفیت باقیمانده: " + left + " نفر";
        addBtn.disabled = false;
    } else {
        box.style.background = "#d9534f";
        box.innerHTML = "تکمیل شد";
        addBtn.disabled = true;
    }
}

/* ------------------------- افزودن بازیکن ------------------------- */
async function addPlayer() {
    if (!SESSION_ID) return alert("سانس ثبت نشده");

    let name = playerName.value.trim();
    if (!name) return alert("نام را وارد کنید");

    let existing = Array.from(document.querySelectorAll("#playersList li span"))
                        .map(s => s.textContent.replace(/^\d+\.\s*/, "").trim());

    if (existing.includes(name)) {
        alert("این بازیکن قبلاً ثبت شده است");
        return;
    }

    showAddLoading();
    addBtn.disabled = true;

    let res = await fetch("/api/add-player", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            session_id: SESSION_ID,
            player_name: name
        })
    });

    hideAddLoading();
    addBtn.disabled = false;

    let data = await res.json();

    if (data.ok) {
        playerName.value = "";
        await loadPlayers();
    } else {
        alert("ثبت نام انجام نشد");
    }
}

/* ------------------------- حذف بازیکن ------------------------- */
async function removePlayer(id) {
    showRemoveLoading();

    await fetch("/api/remove-player", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ id })
    });

    await loadPlayers();

    hideRemoveLoading();
}

loadSession();
</script>

</body>
</html>
